# Dependabot propose chaque semaine des mises à jour (pull requests) :
# dépendances npm et actions GitHub. Les vérifications tournent sur chaque
# proposition ; rien n'est fusionné automatiquement.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      outils-de-build:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: 'deps'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'ci'
